<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f6f8">
<title>SnapSolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#16181d;--muted:#6f7683;--line:#e3e6eb;
  --accent:#2563eb;--accent-h:#1d4ed8;--soft:#eef4ff;--soft-text:#1d4ed8;
  --calc:#f6f8fb;--shadow:0 8px 30px rgba(16,24,40,.06);
  --err:#b42318;--ease:cubic-bezier(.22,1,.36,1);color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#181b21;--text:#eceef2;--muted:#9099a8;--line:#272b33;
  --accent:#3b82f6;--accent-h:#5b97f8;--soft:#18243d;--soft-text:#9cc0ff;
  --calc:#12151a;--shadow:0 8px 30px rgba(0,0,0,.35);
  --err:#ff8a80;color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;
  transition:background .3s var(--ease),color .3s var(--ease);overflow:hidden}
button{font-family:inherit;color:inherit}
svg{display:block}

.app{width:min(100%,720px);height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column}

/* header */
.top{flex:none;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;
  transition:transform .2s var(--ease),border-color .2s,opacity .2s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;transition:transform .5s var(--ease)}
#gear:hover svg{transform:rotate(60deg)}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;padding:0 16px}
.msgs{display:flex;flex-direction:column;gap:18px;padding:8px 0 28px}
.msg{animation:rise .45s var(--ease) both}
.msg.user{align-self:flex-end;max-width:88%}
.msg.user.open{width:min(100%,460px)}
.msg.ai{width:100%}
.bubble{background:var(--accent);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere;width:fit-content;margin-left:auto}
.uimgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;cursor:zoom-in}
.uimg{width:76px;height:76px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--calc);transition:all .35s var(--ease)}
.uimgs.open{display:block;cursor:zoom-out}
.uimgs.open .uimg{width:100%;height:auto;max-height:55vh;object-fit:contain;display:block;margin-bottom:6px;border-radius:16px;background:#fff}

.typing{display:inline-flex;gap:5px;padding:15px 17px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.answer-card{background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:16px;padding:16px 18px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.answer-card .label{color:var(--soft-text);opacity:.85}
.answer{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--soft-text);overflow-wrap:anywhere;line-height:1.4}
.answer p{margin:0}.answer p+p{margin-top:6px}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:15.5px;overflow-wrap:anywhere}
.steps-title{margin:20px 4px 10px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.step-head{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.step-title{font-weight:600;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.step-title p{margin:0}
.step-body{margin:8px 0 0 38px;color:color-mix(in srgb,var(--text) 82%,var(--muted));font-size:15px;overflow-wrap:anywhere}
.calc{margin:12px 0 0 38px;background:var(--calc);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;overflow-x:auto;overflow-y:hidden}
.calc .katex-display{margin:.2em 0}
.md p{margin:0 0 .6em}.md p:last-child{margin:0}
.md ul,.md ol{margin:.3em 0 .6em;padding-left:1.3em}
.md h1,.md h2,.md h3,.md h4{font-size:1.05em;margin:.8em 0 .35em}
.md blockquote{margin:.4em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md code{background:var(--calc);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.9em}
.md strong{font-weight:600}
.reveal{opacity:0;transform:translateY(14px);animation:rise .6s var(--ease) forwards;animation-delay:calc(var(--i,0)*90ms)}

/* composer */
.composer-wrap{flex:none;padding:6px 14px max(12px,env(safe-area-inset-bottom))}
.status{font-size:13px;color:var(--err);padding:0 8px;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s var(--ease),opacity .25s,margin .25s}
.status.show{max-height:60px;opacity:1;margin-bottom:8px}
.status.info{color:var(--muted)}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s,background .3s}
.composer:focus-within,body.drag .composer{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow)}
.atts{display:flex;gap:10px;padding:8px 6px 10px;overflow-x:auto}
.atts:empty{display:none}
.att{position:relative;flex:none;width:64px;height:64px}
.att img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.att.fresh{animation:pop .35s var(--ease)}
.att .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);background:var(--text);color:var(--panel);
  display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .15s var(--ease)}
.att .x:active{transform:scale(.85)}
.att .x svg{width:11px;height:11px}
.field{display:flex;align-items:flex-end;gap:6px}
.round{flex:none;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .15s var(--ease),background .2s,color .2s,opacity .2s}
.round:active:not(:disabled){transform:scale(.88)}
.round svg{width:20px;height:20px}
#plus{background:var(--calc);color:var(--text);border:1px solid var(--line)}
#plus:hover{border-color:var(--accent)}
#send{background:var(--line);color:var(--muted);cursor:default}
#send[data-state="ready"],#send[data-state="busy"]{background:var(--accent);color:#fff;cursor:pointer}
#send[data-state="ready"]:hover,#send[data-state="busy"]:hover{background:var(--accent-h)}
#input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.45;
  resize:none;padding:9px 4px;max-height:150px;overflow-y:auto}
#input::placeholder{color:var(--muted)}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,520px);background:var(--panel);border:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:10px 20px max(22px,env(safe-area-inset-bottom));z-index:11;
  transform:translateY(105%);transition:transform .38s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.open{transform:translateY(0)}
.grab-zone{margin:-10px -20px 6px;padding:14px 20px 16px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab-zone:active{cursor:grabbing}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;transition:background .2s}
.grab-zone:hover .grab,.grab-zone:active .grab{background:var(--muted)}
.sheet h3{margin:0 0 14px;font-size:17px}
.row{margin-bottom:18px}
.row .label{margin-bottom:8px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--calc);color:var(--text);
  border-radius:12px;padding:12px 14px;font:600 14.5px "Inter",inherit;cursor:pointer;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.langs button:active{transform:scale(.97)}
.langs button svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:all .25s var(--ease);color:var(--accent)}
.langs button.on{border-color:var(--accent);background:var(--soft);color:var(--soft-text)}
.langs button.on svg{opacity:1;transform:none}
.langs button span{flex:1;text-align:left}
.flag{flex:none;width:24px;height:18px;border-radius:4px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--calc);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px 6px;font:600 14px "Inter",inherit;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font:600 15px "Inter",inherit;cursor:pointer;transition:transform .15s var(--ease),background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-h)}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);width:100%;margin-top:2px}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:var(--calc);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:15px 16px;font:600 15.5px "Inter",inherit;cursor:pointer;margin-bottom:10px;transition:transform .15s var(--ease),border-color .2s}
.opt:active{transform:scale(.98)}
.opt svg{width:22px;height:22px;color:var(--accent)}

.practice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.practice:first-child{margin-top:0}
.practice .label{color:var(--soft-text)}
.pq{font-size:16.5px;font-weight:500;overflow-wrap:anywhere}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--calc);color:var(--text);
  border-radius:13px;padding:11px 13px;font:500 15px "Inter",inherit;cursor:pointer;transition:border-color .2s,background .2s,opacity .25s,transform .15s var(--ease)}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:scale(.985)}
.choice .ltr{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--soft-text);font-weight:700;font-size:13px;display:grid;place-items:center}
.choice .md{min-width:0;overflow-wrap:anywhere}
.practice.done .choice{pointer-events:none;opacity:.5}
.practice.done .choice.picked{opacity:1;border-color:var(--accent);background:var(--soft)}
.pans{display:flex;gap:8px;margin-top:14px}
.pin{flex:1;min-width:0;border:1px solid var(--line);background:var(--calc);color:var(--text);border-radius:13px;padding:11px 13px;font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.pin::placeholder{color:var(--muted)}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.psend{flex:none;width:44px;border:0;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s var(--ease),background .2s}
.psend:hover{background:var(--accent-h)}
.psend:active{transform:scale(.92)}
.psend svg{width:20px;height:20px}
.palt{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.palt button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 13px;font:600 13px "Inter",inherit;cursor:pointer;transition:border-color .2s,color .2s,transform .15s var(--ease)}
.palt button:hover{border-color:var(--accent);color:var(--text)}
.palt button:active{transform:scale(.96)}
.palt svg{width:16px;height:16px}
.practice.done .pans,.practice.done .palt{display:none}
:root{--ok:#15803d;--warn:#b45309}
:root[data-theme="dark"]{--ok:#4ade80;--warn:#fbbf24}
#settingsSheet{display:flex;flex-direction:column;max-height:90vh;max-height:90dvh}
#settingsSheet .grab-zone,#settingsSheet h3,#settingsSheet .btn-primary{flex:none}
#settingsSheet .btn-primary{margin-top:6px}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -20px;padding:0 20px}
.seg.two{grid-template-columns:1fr 1fr}
.models{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:264px;overflow-y:auto;overscroll-behavior:contain;padding:2px}
.models button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--calc);color:var(--text);border-radius:12px;
  padding:11px 14px;font:600 14.5px "Inter",inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.models button:active{transform:scale(.98)}
.models button .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.models button .chk{flex:none;width:16px;height:16px;opacity:0;transform:scale(.5);transition:all .25s var(--ease);color:var(--accent)}
.models button.on{border-color:var(--accent);background:var(--soft);color:var(--soft-text)}
.models button.on .chk{opacity:1;transform:none}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font:600 11.5px/1.3 "Inter",inherit;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.tag.ok{--c:var(--ok)}.tag.no{--c:var(--warn)}
.tag svg{width:11px;height:11px}
.keybox{margin-top:12px}
.keybox .label{margin-bottom:6px}
.keyrow{display:flex;align-items:center;gap:10px}
.keyrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--calc);color:var(--text);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.keyrow input::placeholder{color:var(--muted)}
.keyrow input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.keyrow a{flex:none;font-size:13px;font-weight:600;color:var(--soft-text);text-decoration:none}
.keyrow a:hover{text-decoration:underline}
.btn-danger{width:100%;background:transparent;border:1px solid color-mix(in srgb,var(--err) 45%,transparent);color:var(--err)}
.btn-danger:hover{border-color:var(--err)}
.btn-danger.arm{background:var(--err);border-color:var(--err);color:var(--panel)}
.mnote{font-size:13px;color:var(--muted);margin:8px 2px 0}
.via{margin:8px 4px 0;font-size:12.5px;color:var(--muted)}
.noanim,.noanim .reveal{animation:none!important;opacity:1!important;transform:none!important}

.veil{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:22px;background:color-mix(in srgb,var(--accent) 8%,transparent);
  display:grid;place-items:center;font-weight:600;color:var(--soft-text);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
body.drag .veil{opacity:1}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation-name:riseTo}
@keyframes riseTo{to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}
@media(max-width:480px){.step-body,.calc{margin-left:0}.answer{font-size:20px}.msg.user{max-width:92%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="newChat" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <span></span>
    <button class="icon-btn" id="gear" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="chat" id="chat"><div class="msgs" id="msgs" aria-live="polite"></div></main>

  <footer class="composer-wrap">
    <div class="status" id="status" role="status"></div>
    <div class="composer">
      <div class="atts" id="atts"></div>
      <div class="field">
        <button class="round" id="plus" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" autocomplete="off" enterkeyhint="send"></textarea>
        <button class="round" id="send" type="button" data-state="idle" disabled></button>
      </div>
    </div>
  </footer>
</div>

<input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>
<input id="fileLibrary" type="file" accept="image/*" multiple hidden>
<div class="veil" data-i18n="drop"></div>
<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="photoSheet" role="dialog" aria-modal="true">
  <div class="grab-zone"><div class="grab"></div></div>
  <button class="opt" id="optCamera" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

working on), and ALWAYS finish with @@KEY. Choose the answer type: if the student asks for multiple choice (a, b, c), give exactly 3 options as @@CHOICE lines (shown as A, B, C: do not write the letters yourself; exactly one is correct, the others are plausible common mistakes). If the student asks for an open answer (typing or a photo of their work), write NO @@CHOICE lines. If they do not specify, use an open answer for calculation problems and multiple choice for conceptual ones, and vary it between problems. Every @@CHOICE and the problem itself must wrap ALL math in $...$ (for example: @@CHOICE $(-\\infty, -1) \\cup (3, \\infty)$). Never reveal the solution or the answer outside @@KEY, and put the correct option letter in @@KEY.\n- CHECKING: when the student answers a practice problem (a chosen letter like \"B) ...\", typed text, or a photo of their written work and result), compare it with your @@KEY from the conversation (for photos, read their work and result carefully). Start with a clear verdict (correct / not correct / partially correct), then give specific feedback: what they did well, where exactly a mistake happened and why. If the answer was wrong or the method was shaky, show the correct solution using @@STEP blocks. Be encouraging, and offer another problem. Do not output a new @@PRACTICE unless asked.\n- Math inside prose: inline $...$ and display $$...$$ (LaTeX). Never use the dollar sign for money; write the currency in words or letters.\n- Do not wrap the reply in code fences and do not mention these rules.";
const systemPrompt=l=>SYSTEM_TMPL.replace('@@LANG@@',l);

async function netFetch(url,opts){
  try{return await fetch(url,opts)}
  catch(e){if(e&&e.name==='AbortError')throw e;throw new Error(t('serverDown'))}
}
async function errMsg(res,def){
  try{const d=await res.json();const e=d&&d.error;if(e&&typeof e==='object')return e.message||def;if(typeof e==='string')return e}catch{}
  return def;
}
const b64cache=new WeakMap();
function fileB64(f){
  if(!b64cache.has(f))b64cache.set(f,new Promise((ok,no)=>{
    const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(f);
  }));
  return b64cache.get(f);
}

/* ----- reply parser (same marker format the prompt asks for) ----- */
const MARK=/^\s*@@(ANSWER|STEP|CALC|PRACTICE|CHOICE|KEY)\b[ \t]*(.*)$/;
function cleanTex(s){
  s=s.trim();
  s=s.replace(/^\$\$?\s*|\s*\$\$?$/g,'');
  s=s.replace(/^\\\[\s*|\s*\\\]$/g,'');
  return s.trim();
}
function parseReply(text){
  text=(text||'').trim();
  const fence=text.match(/^```[a-zA-Z]*\n([\s\S]*?)\n```$/);
  if(fence)text=fence[1].trim();
  const answer=[],steps=[],practice=[],choices=[];let mode='answer';
  for(const line of text.split(/\r?\n/)){
    const m=MARK.exec(line);
    if(m){
      const kind=m[1],rest=m[2].trim();
      if(kind==='ANSWER'){mode='answer';if(rest)answer.push(rest)}
      else if(kind==='STEP'){steps.push({title:rest,explanation:[],calculation:[]});mode='explanation'}
      else if(kind==='CALC'){
        if(!steps.length)steps.push({title:'',explanation:[],calculation:[]});
        mode='calculation';if(rest)steps[steps.length-1].calculation.push(rest);
      }
      else if(kind==='PRACTICE'){mode='practice';if(rest)practice.push(rest)}
      else if(kind==='CHOICE'){mode='choice';choices.push(rest?[rest]:[])}
      else mode='key';   /* KEY stays in the raw text only, never shown */
      continue;
    }
    if(mode==='answer')answer.push(line);
    else if(mode==='practice')practice.push(line);
    else if(mode==='choice')choices[choices.length-1].push(line);
    else if(mode==='key'){}
    else steps[steps.length-1][mode].push(line);
  }
  const problem=practice.join('\n').trim();
  const choiceList=[];
  for(const x of choices){
    let c=x.join(' ').trim();if(!c)continue;
    if(!c.includes('$')&&c.includes('\\'))c='$'+c+'$';   /* the model forgot the math delimiters */
    choiceList.push(c);
  }
  return {
    answer:answer.join('\n').trim(),
    steps:steps.map(s=>({title:s.title,explanation:s.explanation.join('\n').trim(),calculation:cleanTex(s.calculation.join('\n'))})),
    practice:(problem||choiceList.length)?{problem,choices:choiceList}:null
  };
}

/* ----- request builders ----- */
function geminiContents(turns,system,inlineSystem){
  return turns.map((turn,n)=>{
    const parts=[];
    if(inlineSystem&&system&&n===0)parts.push({text:system});
    turn.parts.forEach(p=>parts.push(p.image?{inline_data:{mime_type:p.image[0],data:p.image[1]}}:{text:p.text}));
    return {role:turn.role,parts};
  });
}
function openaiMessages(turns,system){
  const out=system?[{role:'system',content:system}]:[];
  turns.forEach(turn=>{
    let content=turn.parts.map(p=>p.image
      ?{type:'image_url',image_url:{url:`data:${p.image[0]};base64,${p.image[1]}`}}
      :{type:'text',text:p.text});
    if(content.every(c=>c.type==='text'))content=content.map(c=>c.text).join('\n');
    out.push({role:turn.role==='user'?'user':'assistant',content});
  });
  return out;
}

/* ----- providers: each returns the model's text or throws an Error with a readable message ----- */
async function callGemini(model,system,turns,temperature,maxTokens,signal){
  const inline=!!model.noSystem;
  const payload={contents:geminiContents(turns,system,inline),generationConfig:{temperature}};
  if(maxTokens)payload.generationConfig.maxOutputTokens=maxTokens;
  if(system&&!inline)payload.systemInstruction={parts:[{text:system}]};
  const res=await netFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.id)}:generateContent`,
    {method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':gKey},body:JSON.stringify(payload)});
  if(!res.ok){
    const m=await errMsg(res,'Gemini API request failed.');
    if(res.status===401||res.status===403||(res.status===400&&/api key/i.test(m)))throw new Error('Gemini rejected the API key or its permissions. Check your key in Settings.');
    if(res.status===400)throw new Error(`Gemini rejected the request: ${m}`);
    if(res.status===404)throw new Error(`${model.name} is not available for your account. Pick another model in Settings.`);
    if(res.status===429)throw new Error(`${model.name} hit its free-tier limit. Wait a little, or pick another model in Settings.`);
    throw new Error(`Gemini API error (${res.status}): ${m}`);
  }
  const d=await res.json();
  const parts=(((d.candidates||[])[0]||{}).content||{}).parts||[];
  const out=parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('\n').trim();
  if(!out){
    const why=d.promptFeedback&&d.promptFeedback.blockReason;
    throw new Error(`Gemini did not return an answer${why?': '+why:'. Try a clearer photo or rephrase the question.'}`);
  }
  return out;
}
async function callOpenRouter(model,system,turns,temperature,maxTokens,signal){
  const body={model:model.id,messages:openaiMessages(turns,system),temperature};
  if(maxTokens)body.max_tokens=maxTokens;
  const res=await netFetch('https://openrouter.ai/api/v1/chat/completions',
    {method:'POST',signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+orKey,'HTTP-Referer':location.origin,'X-Title':'SnapSolve'},body:JSON.stringify(body)});
  if(!res.ok){
    const m=await errMsg(res,'OpenRouter request failed.');
    if(res.status===401)throw new Error('OpenRouter rejected your API key. Check it in Settings.');
    if(res.status===402)throw new Error('OpenRouter says this request needs credits. Pick a free model, or add credits on openrouter.ai.');
    if(res.status===404)throw new Error(`${model.name} is not available on OpenRouter right now. Pick another model in Settings.`);
    if(res.status===429)throw new Error(`${model.name} is rate limited (free models have per-minute and daily caps). Wait a little, or pick another model.`);
    throw new Error(`OpenRouter error (${res.status}): ${m}`);
  }
  const d=await res.json();
  if(d.error)throw new Error('OpenRouter error: '+(d.error.message||d.error));
  let c=((((d.choices||[])[0]||{}).message)||{}).content;
  if(Array.isArray(c))c=c.map(x=>(x&&x.text)||'').join('\n');
  const out=String(c||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  if(!out)throw new Error(`${model.name} did not return an answer. Try again or pick another model.`);
  return out;
}
const complete=(use,system,turns,temperature,maxTokens,signal)=>
  (use.provider==='openrouter'?callOpenRouter:callGemini)(use,system,turns,temperature,maxTokens,signal);

/* free OpenRouter chat models, loaded live because the list changes often */
async function fetchOpenRouterModels(){
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);
  try{
    const res=await fetch('https://openrouter.ai/api/v1/models',{signal:c.signal});
    if(!res.ok)throw new Error();
    const d=await res.json();
    const zero=v=>{const n=parseFloat(v);return n===0};
    const found=(d.data||[]).filter(m=>{
      const a=m.architecture||{},p=m.pricing||{},ins=a.input_modalities||[],outs=a.output_modalities||[];
      return m.id&&zero(p.prompt)&&zero(p.completion)&&ins.includes('text')&&outs.length===1&&outs[0]==='text';
    }).map(m=>({
      id:m.id,
      name:String(m.name||m.id).replace(/\s*\(free\)\s*$/i,'').trim().replace(': ',' '),
      vision:((m.architecture||{}).input_modalities||[]).includes('image')
    }));
    if(!found.length)throw new Error();
    found.sort((a,b)=>(a.vision===b.vision?0:a.vision?-1:1)||a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    return {list:found,live:true};
  }catch{return {list:OR_FALLBACK,live:false}}
  finally{clearTimeout(timer)}
}

/* ----- conversation → provider-neutral turns ----- */
async function buildTurns(use){
  const src=history.slice(-60),items=[];let budget=6;
  for(let i=src.length-1;i>=0;i--){
    const m=src[i];
    if(m.role==='user'){
      let files=[],text=m.text;
      if(use.vision){files=m.files.slice(0,Math.max(0,budget));budget-=files.length}
      else if(m.files.length)text=(text?text+'\n':'')+'[The student attached a photo here, which you cannot see.]';
      items.unshift({role:'user',text,files});
    }else items.unshift({role:'model',text:m.raw,files:[]});
  }
  const turns=[];
  for(const m of items){
    const parts=[];
    for(const f of m.files)parts.push({image:[f.type||'image/jpeg',await fileB64(f)]});
    const text=String(m.text||'').trim();if(text)parts.push({text});
    if(!parts.length)continue;
    const last=turns[turns.length-1];
    if(last&&last.role===m.role)last.parts.push(...parts);else turns.push({role:m.role,parts});
  }
  while(turns.length&&turns[0].role!=='user')turns.shift();
  return turns;
}
async function apiChat(use,signal){
  const turns=await buildTurns(use);
  if(!turns.length||turns[turns.length-1].role!=='user')throw new Error(t('fail'));
  const raw=await complete(use,systemPrompt(LANG_NAMES[lang]||'English'),turns,0.2,8192,signal);
  const p=parseReply(raw);
  return {answer:p.answer,steps:p.steps,practice:p.practice,raw};
}
async function apiTranslate(target,items,use){
  const language=LANG_NAMES[target]||'English';
  const numbered=items.map((it,n)=>`=====ITEM ${n}=====\n${it.text}`).join('\n');
  const prompt=[
    `Translate every item below into ${language}. The items are messages from a math tutoring chat.`,
    'Rules:',
    '- Keep every separator line "=====ITEM n=====" exactly as it is, and keep the items in the same order.',
    '- Lines that begin with @@ANSWER, @@STEP, @@CALC, @@PRACTICE, @@CHOICE or @@KEY are markers: keep the marker word exactly (in English) and translate only the text after it or under it.',
    '- Do NOT change any math: LaTeX inside $...$ or $$...$$, and everything under @@CALC, stays exactly as is. Keep numbers, Markdown formatting and line breaks.',
    '- Output only the translated items, nothing else.',
    '',numbered
  ].join('\n');
  const out=await complete(use,null,[{role:'user',parts:[{text:prompt}]}],0,use.provider==='gemini'?32000:null);
  const pieces=out.split(/^=====ITEM (\d+)=====[ \t]*$/m),found={};
  for(let k=1;k<pieces.length-1;k+=2)found[+pieces[k]]=pieces[k+1].trim();
  if(items.some((_,n)=>!(n in found)))throw new Error('The translation came back incomplete. Please try again.');
  return items.map((it,n)=>({text:found[n],data:it.role==='model'?parseReply(found[n]):null}));
}

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const max=1600,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    return blob&&blob.size<file.size?new File([blob],'photo.jpg',{type:'image/jpeg'}):file;
  }catch{return file}
}
async function addFiles(list){
  for(const file of list){
    if(!file||!file.type.startsWith('image/')){showError(t('notImage'));continue}
    if(pending.length>=MAX_IMG){showError(t('tooMany'));break}
    const f=await shrink(file);
    if(f.size>10*1024*1024){showError(t('tooBig'));continue}
    if(pending.length>=MAX_IMG){showError(t('tooMany'));break}
    pending.push({file:f,url:URL.createObjectURL(f),fresh:true});
    renderAtts();
  }
}
function renderAtts(){
  atts.innerHTML='';
  pending.forEach(p=>{
    const d=document.createElement('div');d.className='att'+(p.fresh?' fresh':'');p.fresh=false;
    d.innerHTML=`<img alt=""><button type="button" class="x" aria-label="${esc(t('remove'))}">${ICON.x}</button>`;
    d.querySelector('img').src=p.url;
    d.querySelector('.x').onclick=()=>{URL.revokeObjectURL(p.url);pending=pending.filter(q=>q!==p);renderAtts()};
    atts.appendChild(d);
  });
  updateSendUI();
}

window.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;document.body.classList.remove('drag');addFiles([...e.dataTransfer.files])});

/* ---------- composer ---------- */
function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}
function updateSendUI(){
  const has=(input.value.trim().length>0||pending.length>0)&&!translating;
  sendBtn.dataset.state=busy?'busy':has?'ready':'idle';
  sendBtn.disabled=!busy&&!has;
  if(lastBusy!==busy){sendBtn.innerHTML=busy?ICON.stop:ICON.up;lastBusy=busy}
  sendBtn.setAttribute('aria-label',busy?t('stop'):t('send'));
}
input.addEventListener('input',()=>{autosize();updateSendUI();clearStatus()});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!touch){e.preventDefault();send()}
});
sendBtn.addEventListener('click',send);

/* ---------- markdown + math ---------- */
if(window.marked)marked.setOptions({breaks:true,gfm:true});
function tex(s,disp){
  if(!window.katex)return esc(s);
  try{return katex.renderToString(s,{displayMode:!!disp,throwOnError:false})}catch{return esc(s)}
}
function md(src,inline){
  src=String(src==null?'':src);
  if(!window.marked||!window.DOMPurify)return esc(src);
  const m=[];
  src=src.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g,(x,a,b,c,d)=>{
    m.push({t:a??b??c??d,disp:a!==undefined||b!==undefined});return '@@M'+(m.length-1)+'@@'});
  let html=inline?marked.parseInline(src):marked.parse(src);
  html=DOMPurify.sanitize(html);
  return html.replace(/@@M(\d+)@@/g,(x,i)=>tex(m[i].t,m[i].disp));
}

/* ---------- messages ---------- */
function addUser(msg,animate=true){
  const el=document.createElement('div');el.className='msg user'+(animate?'':' noanim');el._urls=[];
  if(msg.files.length){
    const g=document.createElement('div');g.className='uimgs';g.setAttribute('role','button');g.tabIndex=0;g.setAttribute('aria-expanded','false');
    msg.files.forEach(f=>{const u=URL.createObjectURL(f);el._urls.push(u);const im=document.createElement('img');im.className='uimg';im.alt='';im.src=u;g.appendChild(im)});
    const toggle=()=>{const o=g.classList.toggle('open');el.classList.toggle('open',o);g.setAttribute('aria-expanded',o)};
    g.addEventListener('click',toggle);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
    el.appendChild(g);
  }
  if(msg.text){const b=document.createElement('div');b.className='bubble';b.textContent=msg.text;el.appendChild(b)}
  msgs.appendChild(el);return el;
}
function addTyping(){
  const el=document.createElement('div');el.className='msg ai';el.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  msgs.appendChild(el);return el;
}
function addAI(data,entry,animate=true){
  const el=document.createElement('div');el.className='msg ai'+(animate?'':' noanim');
  let i=0;const d=()=>`style="--i:${i++}"`;
  const steps=Array.isArray(data.steps)?data.steps:[];
  let h='';
  if(steps.length){
    if(data.answer)h+=`<div class="answer-card reveal" ${d()}><p class="label">${esc(t('answer'))}</p><div class="answer md">${md(data.answer,false)}</div></div>`;
    h+=`<p class="label steps-title reveal" ${d()}>${esc(t('steps'))}</p>`;
    steps.forEach((s,n)=>{
      h+=`<article class="step reveal" ${d()}><div class="step-head"><div class="num">${n+1}</div><div class="step-title md">${md(s.title,true)}</div></div>`;
      if(s.explanation)h+=`<div class="step-body md">${md(s.explanation,false)}</div>`;
      if(s.calculation)h+=`<div class="calc">${tex(s.calculation,true)}</div>`;
      h+=`</article>`;
    });
  }else if(data.answer||!data.practice){
    h+=`<div class="prose md reveal" ${d()}>${md(data.answer||'—',false)}</div>`;
  }
  const p=data.practice;
  if(p){
    h+=`<div class="practice reveal" ${d()}><p class="label">${esc(t('practice'))}</p><div class="pq md">${md(p.problem,false)}</div>`;
    if(p.choices&&p.choices.length){
      h+=`<div class="choices">`+p.choices.map((c,i)=>`<button type="button" class="choice" data-i="${i}"><span class="ltr">${String.fromCharCode(65+i)}</span><span class="md">${md(c,true)}</span></button>`).join('')+`</div>`;
      h+=`<div class="palt"><button type="button" class="ptype">${ICON.pen}${esc(t('pType'))}</button><button type="button" class="pphoto">${ICON.cam}${esc(t('pPhoto'))}</button></div>`;
    }else{
      h+=`<div class="pans"><input class="pin" type="text" autocomplete="off" enterkeyhint="send" placeholder="${esc(t('pPh'))}"><button type="button" class="psend" aria-label="${esc(t('send'))}">${ICON.up}</button></div>`;
      h+=`<div class="palt"><button type="button" class="pphoto">${ICON.cam}${esc(t('pPhoto'))}</button></div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
  if(entry&&entry.via){const v=document.createElement('p');v.className='via';v.textContent=t('usedFor').replace('{m}',entry.via);el.appendChild(v)}
  const card=el.querySelector('.practice');
  if(card&&entry){
    entry.card=card;
    const locked=()=>card.classList.contains('done')||busy||translating;
    const submitInline=()=>{
      const pin=card.querySelector('.pin');if(!pin||locked())return;
      const v=pin.value.trim();if(!v&&!pending.length)return;
      input.value=v;autosize();updateSendUI();send();
    };
    card.addEventListener('click',e=>{
      if(locked())return;
      const b=e.target.closest('.choice');
      if(b){pickChoice(entry,+b.dataset.i,p.choices[+b.dataset.i]);return}
      if(e.target.closest('.psend')){submitInline();return}
      if(e.target.closest('.pphoto')){pickPhoto();return}
      if(e.target.closest('.ptype')){input.focus();return}
    });
    const pin=card.querySelector('.pin');
    if(pin)pin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submitInline()}});
  }
  msgs.appendChild(el);return el;
}
function scrollBottom(){chatEl.scrollTo({top:chatEl.scrollHeight,behavior:'smooth'})}
function scrollToEl(el){chatEl.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:'smooth'})}

function setBusy(b){busy=b;updateSendUI()}
function restore(m){
  if(!input.value.trim()&&m.text){input.value=m.text;autosize()}
  m.files.forEach(f=>{if(pending.length<MAX_IMG)pending.push({file:f,url:URL.createObjectURL(f),fresh:true})});
  renderAtts();
}
async function send(){
  if(busy){if(ctrl)ctrl.abort();return}
  if(translating)return;
  const text=input.value.trim();
  if(!text&&!pending.length)return;
  clearStatus();
  const cur=currentModel();
  let use=cur;
  if(pending.length&&!cur.vision)use=visionFallback(cur)||cur;   /* photo + text-only model: borrow a model that can see */
  const switched=use!==cur;
  if(!hasKey(use.provider)){
    if(nextChoice){nextChoice=null;input.value='';autosize();updateSendUI()}
    showError(t(use.provider==='gemini'?'needGemini':'needKey'));
    provTab=use.provider;buildModels();showSheet($('#settingsSheet'));return;
  }
  const choice=nextChoice;nextChoice=null;
  const files=pending.map(p=>p.file);
  pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];renderAtts();
  input.value='';autosize();
  const sendLang=lang;
  const userMsg={role:'user',text,files,src:sendLang,v:{[sendLang]:{text}}};history.push(userMsg);
  const uEl=addUser(userMsg),pend=addTyping();
  const locked=lockPractice(choice);
  newBtn.hidden=false;setBusy(true);scrollBottom();
  ctrl=new AbortController();
  try{
    if(switched)showInfo(t('photoSwitch').replace('{m}',use.name));
    const data=await apiChat(use,ctrl.signal);
    pend.remove();if(switched)clearStatus();
    const rawText=data.raw||data.answer||'';
    const parsed={answer:data.answer,steps:data.steps,practice:data.practice};
    const entry={role:'model',raw:rawText,data:parsed,src:sendLang,v:{[sendLang]:{text:rawText,data:parsed}},via:switched?use.name:''};
    const el=addAI(data,entry);
    history.push(entry);
    scrollToEl(el);
  }catch(e){
    history.pop();if(switched)clearStatus();
    uEl._urls.forEach(u=>URL.revokeObjectURL(u));uEl.remove();pend.remove();
    restore(userMsg);unlockPractice(locked,choice);
    if(e.name!=='AbortError')showError(e.message==='Failed to fetch'?t('serverDown'):e.message);
  }finally{
    ctrl=null;setBusy(false);
    newBtn.hidden=history.length===0;
    if(queued){queued=false;translateHistory()}
  }
}

/* ---------- practice problems ---------- */
function paintPractice(h){
  if(!h.card)return;
  h.card.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('picked',i===h.chosen));
}
function lockPractice(choice){
  const locked=[];
  history.forEach(h=>{if(h.role==='model'&&h.card&&!h.card.classList.contains('done')){h.card.classList.add('done');locked.push(h)}});
  if(choice){choice.entry.chosen=choice.idx;paintPractice(choice.entry)}
  return locked;
}
function unlockPractice(locked,choice){
  locked.forEach(h=>h.card&&h.card.classList.remove('done'));
  if(choice){delete choice.entry.chosen;paintPractice(choice.entry)}
}
function pickChoice(entry,idx,text){
  nextChoice={entry,idx};
  input.value=`${String.fromCharCode(65+idx)}) ${text}`;autosize();updateSendUI();
  send();
}

/* ---------- translate the chat when the language changes ---------- */
function rerender(){
  const top=chatEl.scrollTop;
  msgs.querySelectorAll('.msg').forEach(m=>(m._urls||[]).forEach(u=>URL.revokeObjectURL(u)));
  msgs.innerHTML='';
  const lastUser=history.map(h=>h.role).lastIndexOf('user');
  history.forEach((h,i)=>{
    if(h.role==='user')addUser(h,false);
    else{
      addAI(h.data,h,false);
      if(h.card&&i<lastUser)h.card.classList.add('done');
      paintPractice(h);
    }
  });
  chatEl.scrollTop=top;
}
function requestTranslate(){
  if(!history.length)return;
  if(busy||translating){queued=true;return}
  translateHistory();
}
async function translateHistory(){
  if(!history.length||translating)return;
  const target=lang,sent=history.slice();
  translating=true;updateSendUI();showInfo(t('translating'));
  try{
    const map=[];
    const items=[];
    sent.forEach((h,i)=>{
      const text=h.role==='user'?h.text:h.raw;
      if(text&&text.trim()){map.push(i);items.push({role:h.role,text})}
    });
    if(items.length){
      const tm=textModel();
      if(!hasKey(tm.provider))throw new Error(t(tm.provider==='gemini'?'needGemini':'needKey'));
      const data={items:await apiTranslate(target,items,tm)};
      const stale=history.length!==sent.length||history[0]!==sent[0];
      if(!stale){
        map.forEach((hi,n)=>{
          const h=history[hi],it=data.items[n];
          if(h.role==='user')h.text=it.text;
          else{h.raw=it.text;h.data=it.data||h.data}
        });
        rerender();
      }
    }
    clearStatus();
  }catch(e){
    showError(e.message==='Failed to fetch'?t('serverDown'):e.message);
  }finally{
    translating=false;updateSendUI();
    if(lang!==target&&history.length)translateHistory();
  }
}

function resetChat(){
  queued=false;
  if(ctrl)ctrl.abort();
  msgs.querySelectorAll('.msg').forEach(m=>(m._urls||[]).forEach(u=>URL.revokeObjectURL(u)));
  msgs.innerHTML='';history=[];newBtn.hidden=true;clearStatus();
}
newBtn.addEventListener('click',()=>{resetChat();input.focus()});

$('#gKey').value=gKey;$('#orKey').value=orKey;
applyTheme();applyLang();autosize();loadModels();
</script>
